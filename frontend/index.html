<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      IMPORTANT: no canonical link tag and no meta description tag here.
      This file is the template for EVERY route — a hard-coded canonical made Google treat
      every page as a duplicate of the homepage. Per-page title / description / canonical are
      written into each page's own HTML by scripts/prerender.mjs at build time, and by
      react-helmet-async in the browser.
    -->
    <title>KAEORN | Quiet Luxury Fragrances</title>

    <!--
      BOOT COVER — paints BEFORE any JavaScript so visitors never see the unfinished page
      flash and then get covered by the loader. The inline script below runs synchronously in
      <head> (before first paint) and marks <html class="boot">; the React loader (src/components
      Loader.jsx) removes it the moment it takes over, once the page is really ready.
      Skipped (cover stays hidden, real content is visible) for: crawlers/audits, private app
      routes, and visitors without JavaScript. Rules mirror src/boot/bootGate.js.
      Failsafe: if the app never boots, the cover removes itself after 20 s.
    -->
    <style>
      #boot-cover { display: none; position: fixed; inset: 0; z-index: 2147483000; background: #050405; align-items: center; justify-content: center; }
      html.boot #boot-cover { display: flex; }
      html.boot body { overflow: hidden; }
      #boot-cover i { display: block; position: relative; width: 120px; height: 1px; overflow: hidden; background: rgba(239, 230, 220, 0.12); }
      #boot-cover i::after { content: ""; position: absolute; inset: 0; background: #b3122e; transform: translateX(-100%); animation: boot-sweep 1.3s ease-in-out infinite; }
      @keyframes boot-sweep { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #boot-cover i::after { animation: none; transform: none; opacity: 0.6; } }
    </style>
    <script>
      (function () {
        try {
          if (/bot|crawl|spider|slurp|lighthouse|pagespeed|headless/i.test(navigator.userAgent)) return;
          if (/^\/(admin|cart|checkout|account|addresses|my-orders|previous-orders|order|order-success|success|support|verify)(\/|$)/.test(location.pathname)) return;
          var d = document.documentElement;
          d.classList.add("boot");
          setTimeout(function () { d.classList.remove("boot"); }, 20000);
        } catch (e) {}
      })();
    </script>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ LUXURY K FAVICONS -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="boot-cover" aria-hidden="true"><i></i></div>
    <div id="root">
    </div>

    <!-- VITE ENTRY -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- razorpay script -->
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
